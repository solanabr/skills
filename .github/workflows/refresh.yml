name: Refresh registry

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

# Shared with kit-sync.yml: both write src/data and push to main.
concurrency:
  group: registry-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # A rate-limited run waits for the hourly reset instead of failing.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refresh registry + mirrors from GitHub
        run: node scripts/refresh.mjs
        env:
          # REGISTRY_TOKEN (optional): a fine-grained token with public read
          # access gets 5000 calls/h; the Actions token gets 1000/h.
          GITHUB_TOKEN: ${{ secrets.REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Verify every advertised external link is alive
        run: node scripts/check-links.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Build with refreshed data
        run: npm run build
      - name: Verify served bytes match advertised sha256 pins
        run: node scripts/verify-integrity.mjs
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "Registry already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data
          git commit -m "chore(data): weekly registry refresh"
          git push
